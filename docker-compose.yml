# ============================================================
# exam_parser_paddle — AI SERVICE (chỉ chứa service xử lý).
#
# Hạ tầng (MinIO + MongoDB) nằm ở stack RIÊNG: ../exam_parser_infra
# → Chạy exam_parser_infra TRƯỚC, rồi mới chạy stack này.
#
# AI service kết nối hạ tầng qua host (host.docker.internal):
#   MinIO : host.docker.internal:9000
#   Mongo : host.docker.internal:27017
#
# Lệnh:
#   docker compose build ai-service     # build lại image AI
#   docker compose up -d                # chạy AI service
#   docker compose logs -f ai-service   # xem log
#   docker compose down                 # dừng
# ============================================================

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: exam_parser_paddle:latest
    container_name: exam_parser_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # --- MinIO (hạ tầng ở stack exam_parser_infra, qua host) ---
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin12345}
      MINIO_BUCKET: ${MINIO_BUCKET:-exam-parser}
      MINIO_SECURE: "false"
      MINIO_PREFIX: ${MINIO_PREFIX:-exams/}
      MINIO_SAVE_RAW: "true"
      MINIO_PRESIGN_DAYS: "7"
      USE_MINIO_UPLOAD: "true"
      # --- MongoDB (hạ tầng ở stack exam_parser_infra, qua host) ---
      USE_MONGO: "true"
      MONGO_URI: ${MONGO_URI:-mongodb://admin:admin12345@host.docker.internal:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-exam_parser}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-exams}
      # --- Pipeline ---
      USE_VLM_VERIFICATION: "false"
      PADDLE_USE_GPU: "false"
      DEFAULT_DPI: "300"
      TEMP_DIR: /tmp/exam_parser
      LOG_LEVEL: INFO
      CORS_ORIGINS: "*"
    # WSL native Docker KHÔNG tự có host.docker.internal → ánh xạ tới host-gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Cache model Paddle để không tải lại mỗi lần rebuild
      - paddle_models:/root/.paddleocr
      - paddlex_models:/root/.paddlex

volumes:
  paddle_models:
  paddlex_models:
